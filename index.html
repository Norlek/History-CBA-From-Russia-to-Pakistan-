<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>From Russia to Pakistan? — CBA History Q&amp;A Bot</title>
  <style>
    :root {
      --bg-base: #0a0c10;
      --bg-elevated: #121620;
      --bg-card: #161b28;
      --bg-user: #142230;
      --border-main: #2d3548;
      --border-accent: #7c8aa6;
      --text-primary: #f3f5f8;
      --text-secondary: #b6c0d4;
      --text-muted: #8893a8;
      --pad-outer: 20px;
      --pad-box: 22px;
      --chat-h: 380px;
      --title-fs: 22px;
      --body-fs: 14px;
    }

    html[data-device="tablet"] {
      --pad-outer: 16px;
      --pad-box: 18px;
      --chat-h: 350px;
      --title-fs: 20px;
      --body-fs: 14px;
    }

    html[data-device="mobile"] {
      --pad-outer: 10px;
      --pad-box: 14px;
      --chat-h: 310px;
      --title-fs: 18px;
      --body-fs: 13.5px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0;
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(180deg, #090b0f 0%, #10141e 55%, #0b0e14 100%);
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: var(--pad-outer);
    }

    .deck-shell {
      width: 100%;
      max-width: 820px;
      background: var(--bg-elevated);
      border: 2px solid var(--border-accent);
      padding: var(--pad-box);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border-main);
      padding-bottom: 14px;
      margin-bottom: 14px;
    }

    .title-block h1 {
      font-size: var(--title-fs);
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .title-block p {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .badge,
    select,
    .btn-ghost {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border-main);
      padding: 6px 10px;
      font-size: 12px;
    }

    select,
    .btn-ghost {
      cursor: pointer;
    }

    select:hover,
    .btn-ghost:hover {
      border-color: var(--border-accent);
    }

    .key-row {
      display: none;
      gap: 8px;
      margin-bottom: 12px;
    }

    .key-row.open {
      display: flex;
      flex-wrap: wrap;
    }

    .quick-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .q-btn {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border-main);
      padding: 7px 11px;
      font-size: 12px;
      cursor: pointer;
    }

    .q-btn:hover {
      border-color: var(--border-accent);
      background: #1d2436;
    }

    .chat-panel {
      height: var(--chat-h);
      overflow-y: auto;
      background: var(--bg-base);
      border: 1px solid var(--border-main);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 14px;
    }

    .msg {
      max-width: 90%;
      padding: 11px 13px;
      font-size: var(--body-fs);
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .msg.bot {
      align-self: flex-start;
      background: var(--bg-card);
      border: 1px solid var(--border-main);
      color: var(--text-primary);
    }

    .msg.user {
      align-self: flex-end;
      background: var(--bg-user);
      border: 1px solid #3c5673;
      color: var(--text-primary);
    }

    .msg-meta {
      display: block;
      margin-top: 6px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .ask-form {
      display: flex;
      gap: 10px;
    }

    html[data-device="mobile"] .ask-form {
      flex-direction: column;
    }

    input[type="text"],
    input[type="password"] {
      flex: 1;
      padding: 11px 12px;
      font-size: var(--body-fs);
      background: var(--bg-base);
      color: var(--text-primary);
      border: 1px solid var(--border-main);
      outline: none;
    }

    input:focus {
      border-color: var(--border-accent);
    }

    .btn-send {
      padding: 11px 20px;
      font-size: var(--body-fs);
      font-weight: 600;
      background: #232d42;
      color: var(--text-primary);
      border: 1px solid var(--border-accent);
      cursor: pointer;
    }

    .btn-send:hover {
      background: #2e3b57;
    }

    .btn-send:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <main class="deck-shell">
    <header class="top-bar">
      <div class="title-block">
        <h1>From Russia to Pakistan? — History CBA Q&amp;A</h1>
        <p>Checking old maps and history records for the Ghuman family</p>
      </div>
      <div class="toolbar">
        <span id="deviceBadge" class="badge">Device: Detecting...</span>
        <select id="providerSelect" aria-label="Model Source">
          <option value="pollinations">Free API (Pollinations)</option>
          <option value="openrouter">Free Router (OpenRouter)</option>
        </select>
        <button type="button" id="resetBtn" class="btn-ghost">Clear Memory</button>
      </div>
    </header>

    <div id="keyRow" class="key-row">
      <input
        type="password"
        id="orKeyInput"
        placeholder="Optional OpenRouter API key (sk-or-v1-...) for openrouter/free"
      />
      <button type="button" id="saveKeyBtn" class="btn-ghost">Save Key</button>
    </div>

    <div class="quick-list">
      <button type="button" class="q-btn" data-q="Who created this presentation?">Creator</button>
      <button type="button" class="q-btn" data-q="What does the presentation say about moving from Russia to Pakistan?">Russia to Pakistan</button>
      <button type="button" class="q-btn" data-q="What do the 1894 Gazetteer and 1911 Census say about Ghuman?">1894 &amp; 1911 Records</button>
      <button type="button" class="q-btn" data-q="What happened in the 1947 Partition of Punjab?">1947 Partition</button>
    </div>

    <section id="chatPanel" class="chat-panel" aria-live="polite">
      <div class="msg bot">
        I am a bot to answer questions and answers according to the CBA of history from russian to pakistan migration.
        <span class="msg-meta">CBA Presentation Deck • Session Memory Active</span>
      </div>
    </section>

    <form id="askForm" class="ask-form">
      <input
        type="text"
        id="questionInput"
        placeholder="Ask a question about the CBA presentation..."
        autocomplete="off"
        required
      />
      <button type="submit" id="sendBtn" class="btn-send">Ask</button>
    </form>
  </main>

  <script>
    const CREATOR_NAME = "Mohammad Hassan";
    const BOT_IDENTITY = "I am a bot to answer questions and answers according to the CBA of history from russian to pakistan migration.";

    const CBA_CONTEXT = `
Presentation Title: From Russia to Pakistan? Checking old maps and history records for the Ghuman family. Created by: Mohammad Hassan.
- Main Question: Family stories say early people moved south from Russia to Pakistan; history books and maps check that claim with real records.
- Distance & Travel: Russia to Punjab is more than 4,500 km across cold land and high mountains. Moves across Asia took many years and families stayed near water and crops before moving on.
- Oral Stories vs Written Books: The Russia story has no dates or written papers. Sialkot District Gazetteer (1894) lists the Ghuman clan in Delhi, Jammu, and Sialkot.
- Proof & Checks: Historians need real dates, place names, and written records with the family name; right now no written record shows the Ghuman family leaving Russia. Three checks: when people moved, towns passed, and written books listing the name.
- Reasons for Migration: Farm land, trade, wars, or droughts/lack of water.
- Eurasia & Silk Roads: Central Asia sits between northern Asia and South Asia (Samarkand, Bukhara for over 2,000 years); Silk Roads linked Central Asia, Afghanistan, and northern India; mountain gaps like the Khyber Pass lead into plains; four parts of long land trips: wide open plains, Central Asia towns, mountain passes, and river land in Punjab. Road maps show travel was possible, not that one family walked from Russia.
- Punjab & Ghuman Records: A Glossary of the Tribes and Castes of the Punjab (1911) names the Ghuman group in northern India and Punjab. Sialkot District Gazetteer (1894) says early ancestors lived near Delhi before Raja Sanpal Janjua moved to Jammu, and his descendant Raja Ghumman moved into Sialkot and started the Ghuman home. From Sialkot, 21 Ghuman branches built farms in Gujranwala, Gurdaspur, Amritsar, and Lyallpur.
- 1911 Census & Spellings: Census of India 1911 (Punjab Volume XIV) counted 7,579 Ghuman people in Sialkot District alone, plus over twelve villages in Gurdaspur and Sangrur. Spellings include Ghuman, Ghumman, or Ghamman.
- 1947 Partition & Later Moves: In August 1947 a new border split Punjab between Pakistan and India; about 14 million people crossed new borders in 1947; Sialkot ended up in Pakistan and Gurdaspur in India. Starting in the 1950s, Ghuman families moved from Punjab to Britain, Ireland, Canada, the US, and Gulf countries.
- Methods & Sources: Oral history with elders, four main record sets (1911 Punjab Census, Sialkot and Gurdaspur district books, UK 1947 files, FamilySearch/Ancestry), checking map years, UNESCO Silk Roads Programme, Encyclopaedia Britannica, and The National Archives (UK).
`.trim();

    const SYSTEM_PROMPT = `
You answer questions for a school history CBA presentation.
${CBA_CONTEXT}

Strict rules:
1. If asked who you are, what you are, or whether you are Gemini, respond with: "${BOT_IDENTITY}" Never mention Gemini or Google.
2. If asked who created the presentation, who made it, or any question about the creator/author, answer that ${CREATOR_NAME} created the presentation.
3. Only answer questions related to the CBA of history from Russia/Eurasia to Pakistan migration (including the Ghuman family records, Punjab, 1911 census, 1947 Partition, post-1950 migration, historical research/maps/sources, or the presentation/creator). If a question is unrelated to this topic, reply strictly with: Question not related
4. Remember earlier messages in the conversation and keep answers factual, clear, and concise.
`.trim();

    const LOCAL_TOPICS = [
      {
        keys: ["russia", "4,500", "4500", "cold", "steppe", "eurasia", "silk road", "samarkand", "bukhara", "khyber", "route", "corridor", "migrate", "migration"],
        reply: `${BOT_IDENTITY} The presentation notes that Russia to Punjab is over 4,500 km across Eurasia, with routes like Central Asia, the Silk Roads, and the Khyber Pass, while no written record currently proves the Ghuman family moved from Russia.`
      },
      {
        keys: ["1894", "gazetteer", "1911", "census", "7,579", "7579", "sialkot", "gurdaspur", "gujranwala", "amritsar", "lyallpur", "sangrur", "jammu", "delhi", "sanpal", "ghumman", "ghuman", "punjab", "glossary", "21"],
        reply: `${BOT_IDENTITY} Punjab records include the 1894 Sialkot District Gazetteer (traced via Delhi and Jammu to Sialkot), the 1911 Glossary naming 21 Ghuman branches across areas like Gujranwala, Gurdaspur, Amritsar, and Lyallpur, and the 1911 Census counting 7,579 Ghuman people in Sialkot District.`
      },
      {
        keys: ["1947", "partition", "india", "pakistan", "14 million", "border", "1950", "britain", "ireland", "canada", "gulf"],
        reply: `${BOT_IDENTITY} In August 1947, the Partition of Punjab between Pakistan and India saw about 14 million people cross new borders and placed Sialkot in Pakistan and Gurdaspur in India; from the 1950s onward, families also moved to places including Britain, Ireland, Canada, the US, and Gulf countries.`
      },
      {
        keys: ["source", "sources", "proof", "evidence", "archive", "archives", "familysearch", "ancestry", "oral", "map", "maps", "spelling", "ghauman", "ghamman"],
        reply: `${BOT_IDENTITY} The presentation checks oral stories against written records and maps—such as the 1911 Census, district gazetteers, UK National Archives, UNESCO Silk Roads Programme, Encyclopaedia Britannica, and FamilySearch/Ancestry—while noting spelling variations like Ghuman, Ghumman, and Ghamman.`
      }
    ];

    const OFF_TOPIC_WORDS = [
      "minecraft", "roblox", "fortnite", "football", "soccer", "basketball", "cricket",
      "recipe", "cook", "pizza", "burger", "movie", "anime", "music", "song", "tiktok",
      "weather", "temperature", "stock", "bitcoin", "crypto", "algebra", "calculus"
    ];

    const chatPanel = document.getElementById("chatPanel");
    const askForm = document.getElementById("askForm");
    const questionInput = document.getElementById("questionInput");
    const sendBtn = document.getElementById("sendBtn");
    const providerSelect = document.getElementById("providerSelect");
    const keyRow = document.getElementById("keyRow");
    const orKeyInput = document.getElementById("orKeyInput");
    const saveKeyBtn = document.getElementById("saveKeyBtn");
    const resetBtn = document.getElementById("resetBtn");
    const deviceBadge = document.getElementById("deviceBadge");

    let history = [];

    function detectAndApplyDevice() {
      const w = window.innerWidth;
      const touch = navigator.maxTouchPoints > 0 || "ontouchstart" in window;
      let mode = "desktop";
      if (w <= 640 || (touch && w <= 768)) {
        mode = "mobile";
      } else if (w <= 1024) {
        mode = "tablet";
      }
      document.documentElement.setAttribute("data-device", mode);
      deviceBadge.textContent = `Device: ${mode.charAt(0).toUpperCase() + mode.slice(1)} (${w}px)`;
    }

    detectAndApplyDevice();
    window.addEventListener("resize", detectAndApplyDevice);

    function isCreatorAsk(q) {
      const s = q.toLowerCase();
      return (
        s.includes("who created") ||
        s.includes("who made") ||
        s.includes("who built") ||
        s.includes("creator") ||
        s.includes("author") ||
        s.includes("created by") ||
        s.includes("made this presentation") ||
        s.includes("who is behind")
      );
    }

    function isIdentityAsk(q) {
      const s = q.toLowerCase();
      return (
        s.includes("who are you") ||
        s.includes("what are you") ||
        s.includes("are you gemini") ||
        s.includes("gemini") ||
        s.includes("what model")
      );
    }

    function isUnrelatedAsk(q) {
      const s = q.toLowerCase();
      if (isCreatorAsk(s) || isIdentityAsk(s)) return false;
      const onTopic = [
        "russia", "russian", "eurasia", "eurasian", "pakistan", "india", "punjab", "partition",
        "1947", "1911", "1894", "1950", "ghuman", "ghumman", "ghamman", "sialkot", "gurdaspur",
        "gujranwala", "amritsar", "lyallpur", "sangrur", "jammu", "delhi", "silk road", "khyber",
        "samarkand", "bukhara", "census", "gazetteer", "archive", "history", "historical", "cba",
        "migration", "migrate", "map", "maps", "source", "sources", "family", "oral", "presentation"
      ];
      if (onTopic.some((w) => s.includes(w))) return false;
      return OFF_TOPIC_WORDS.some((w) => s.includes(w));
    }

    function addBubble(text, role, meta = "") {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;
      if (role === "bot" && meta) {
        const span = document.createElement("span");
        span.className = "msg-meta";
        span.textContent = meta;
        div.appendChild(span);
      }
      chatPanel.appendChild(div);
      chatPanel.scrollTop = chatPanel.scrollHeight;
    }

    function cleanReply(raw, question) {
      if (isCreatorAsk(question)) return `${CREATOR_NAME} created this presentation.`;
      if (isIdentityAsk(question)) return BOT_IDENTITY;
      const text = (raw || "").trim();
      if (!text) return "Question not related";
      if (/^question not related[.!]?$/i.test(text)) return "Question not related";
      return text.replace(/\b(i am|i'm|as) (an? )?(gemini|google ai|large language model|language model)\b/gi, BOT_IDENTITY).trim();
    }

    function localAnswer(question) {
      if (isCreatorAsk(question)) return `${CREATOR_NAME} created this presentation.`;
      if (isIdentityAsk(question)) return BOT_IDENTITY;
      if (isUnrelatedAsk(question)) return "Question not related";

      const s = question.toLowerCase();
      let best = null;
      let score = 0;
      for (const item of LOCAL_TOPICS) {
        let hit = 0;
        for (const k of item.keys) {
          if (s.includes(k)) hit += 1;
        }
        if (hit > score) {
          score = hit;
          best = item;
        }
      }
      if (best && score > 0) return best.reply;

      const recent = history
        .filter((m) => m.role === "user")
        .slice(-3)
        .map((m) => m.content.toLowerCase())
        .join(" ");
      for (const item of LOCAL_TOPICS) {
        if (item.keys.some((k) => recent.includes(k))) return item.reply;
      }
      return "Question not related";
    }

    async function callPollinations(messages) {
      const res = await fetch("https://text.pollinations.ai/openai/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: "openai", messages, temperature: 0.25 })
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      return data?.choices?.[0]?.message?.content || "";
    }

    async function callOpenRouter(messages) {
      const key = (orKeyInput.value || sessionStorage.getItem("cba_or_key") || "").trim();
      if (!key) throw new Error("Missing OpenRouter key");
      const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${key}`,
          "HTTP-Referer": window.location.href,
          "X-Title": "Russia to Pakistan CBA Bot"
        },
        body: JSON.stringify({ model: "openrouter/free", messages, temperature: 0.25 })
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      return data?.choices?.[0]?.message?.content || "";
    }

    async function getAnswer(question) {
      if (isCreatorAsk(question)) {
        return { text: `${CREATOR_NAME} created this presentation.`, meta: "CBA Creator Record" };
      }
      if (isIdentityAsk(question)) {
        return { text: BOT_IDENTITY, meta: "CBA Bot Identity" };
      }
      if (isUnrelatedAsk(question)) {
        return { text: "Question not related", meta: "Topic Filter" };
      }

      const messages = [
        { role: "system", content: SYSTEM_PROMPT },
        ...history.slice(-14),
        { role: "user", content: question }
      ];

      try {
        const mode = providerSelect.value;
        const out = mode === "openrouter" ? await callOpenRouter(messages) : await callPollinations(messages);
        return {
          text: cleanReply(out, question),
          meta: mode === "openrouter" ? "OpenRouter Free • Memory On" : "Pollinations Free • Memory On"
        };
      } catch (_) {
        return {
          text: localAnswer(question),
          meta: "CBA Local Knowledge • Memory On"
        };
      }
    }

    providerSelect.addEventListener("change", () => {
      keyRow.classList.toggle("open", providerSelect.value === "openrouter");
    });

    saveKeyBtn.addEventListener("click", () => {
      sessionStorage.setItem("cba_or_key", orKeyInput.value.trim());
      addBubble("Saved OpenRouter key for this browser tab.", "bot", "Settings");
    });

    resetBtn.addEventListener("click", () => {
      history = [];
      chatPanel.innerHTML = "";
      addBubble(`${BOT_IDENTITY} Memory cleared.`, "bot", "Memory Reset");
    });

    askForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const q = questionInput.value.trim();
      if (!q) return;

      questionInput.value = "";
      sendBtn.disabled = true;
      addBubble(q, "user");

      const pending = document.createElement("div");
      pending.className = "msg bot";
      pending.textContent = "Checking CBA history records...";
      chatPanel.appendChild(pending);
      chatPanel.scrollTop = chatPanel.scrollHeight;

      const res = await getAnswer(q);
      pending.remove();

      addBubble(res.text, "bot", res.meta);
      history.push({ role: "user", content: q });
      history.push({ role: "assistant", content: res.text });

      sendBtn.disabled = false;
      questionInput.focus();
    });

    document.querySelectorAll(".q-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        questionInput.value = btn.getAttribute("data-q");
        askForm.dispatchEvent(new Event("submit"));
      });
    });
  </script>
</body>
</html>
