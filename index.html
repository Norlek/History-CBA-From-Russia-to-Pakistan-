<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>From Russia to Pakistan? — Official CBA Bot</title>
  <style>
    :root {
      --bg-void: #06030e;
      --bg-deep: #120826;
      --bg-mid: #1f0d42;
      --glass-shell: rgba(20, 12, 42, 0.56);
      --glass-card: rgba(42, 22, 86, 0.54);
      --glass-user: rgba(74, 28, 134, 0.64);
      --glass-input: rgba(11, 7, 24, 0.62);
      --border-glass: rgba(226, 194, 255, 0.34);
      --border-bright: rgba(233, 213, 255, 0.82);
      --text-primary: #fdfaff;
      --text-secondary: #e7d8ff;
      --text-muted: #bba4e6;
      --blur-heavy: 34px;
      --blur-card: 22px;
      --outer-pad: 22px;
      --inner-pad: 26px;
      --chat-h: 445px;
      --title-fs: 25px;
      --sub-fs: 13.5px;
      --msg-fs: 14.5px;
    }

    html[data-device="tablet"] {
      --outer-pad: 16px;
      --inner-pad: 22px;
      --chat-h: 395px;
      --title-fs: 22px;
      --sub-fs: 13px;
      --msg-fs: 14px;
    }

    html[data-device="mobile"] {
      --outer-pad: 12px;
      --inner-pad: 16px;
      --chat-h: 355px;
      --title-fs: 19px;
      --sub-fs: 12.5px;
      --msg-fs: 13.5px;
      --blur-heavy: 24px;
      --blur-card: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 18%, rgba(168, 85, 247, 0.42), transparent 44%),
        radial-gradient(circle at 85% 24%, rgba(192, 132, 252, 0.3), transparent 48%),
        radial-gradient(circle at 50% 90%, rgba(126, 34, 206, 0.36), transparent 52%),
        linear-gradient(155deg, var(--bg-void) 0%, var(--bg-deep) 50%, var(--bg-mid) 100%);
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: var(--outer-pad);
      overflow-x: hidden;
    }

    .liquid-field {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .liquid-blob {
      position: absolute;
      filter: blur(56px);
      opacity: 0.58;
      will-change: transform, border-radius;
    }

    .blob-a {
      width: 440px;
      height: 440px;
      top: -90px;
      left: -80px;
      background: radial-gradient(circle at 30% 30%, rgba(192, 132, 252, 0.65), rgba(126, 34, 206, 0.25));
      animation: morphLiquidA 14s ease-in-out infinite alternate;
    }

    .blob-b {
      width: 480px;
      height: 480px;
      bottom: -120px;
      right: -90px;
      background: radial-gradient(circle at 65% 65%, rgba(168, 85, 247, 0.6), rgba(88, 28, 135, 0.22));
      animation: morphLiquidB 17s ease-in-out infinite alternate;
    }

    .blob-c {
      width: 340px;
      height: 340px;
      top: 42%;
      left: 52%;
      background: radial-gradient(circle at 50% 50%, rgba(216, 180, 254, 0.35), rgba(147, 51, 234, 0.14));
      animation: morphLiquidC 12s ease-in-out infinite alternate;
    }

    @keyframes morphLiquidA {
      0% {
        border-radius: 42% 58% 63% 37% / 44% 39% 61% 56%;
        transform: translate3d(0, 0, 0) scale(1);
      }
      50% {
        border-radius: 61% 39% 41% 59% / 55% 62% 38% 45%;
        transform: translate3d(38px, 24px, 0) scale(1.09);
      }
      100% {
        border-radius: 36% 64% 52% 48% / 60% 35% 65% 40%;
        transform: translate3d(16px, -18px, 0) scale(0.96);
      }
    }

    @keyframes morphLiquidB {
      0% {
        border-radius: 56% 44% 38% 62% / 47% 58% 42% 53%;
        transform: translate3d(0, 0, 0) scale(1);
      }
      50% {
        border-radius: 40% 60% 57% 43% / 63% 41% 59% 37%;
        transform: translate3d(-34px, -28px, 0) scale(1.08);
      }
      100% {
        border-radius: 64% 36% 46% 54% / 38% 54% 46% 62%;
        transform: translate3d(-14px, 20px, 0) scale(0.97);
      }
    }

    @keyframes morphLiquidC {
      0% {
        border-radius: 50% 50% 45% 55% / 55% 45% 55% 45%;
        transform: translate3d(-50%, -50%, 0) scale(0.95);
      }
      100% {
        border-radius: 38% 62% 60% 40% / 42% 58% 42% 58%;
        transform: translate3d(-44%, -56%, 0) scale(1.12);
      }
    }

    .liquid-shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 900px;
      border-radius: 36px;
      background: var(--glass-shell);
      backdrop-filter: blur(var(--blur-heavy)) saturate(180%);
      -webkit-backdrop-filter: blur(var(--blur-heavy)) saturate(180%);
      border: 1.5px solid var(--border-bright);
      box-shadow:
        0 28px 80px rgba(0, 0, 0, 0.65),
        inset 0 2px 0 rgba(255, 255, 255, 0.28),
        inset 0 -10px 24px rgba(168, 85, 247, 0.12),
        0 0 48px rgba(168, 85, 247, 0.26);
      padding: var(--inner-pad);
      overflow: hidden;
      animation: liquidEmerge 0.82s cubic-bezier(0.22, 1.35, 0.36, 1) both, shellRippleIdle 7s ease-in-out 0.9s infinite;
    }

    .liquid-shell::before {
      content: "";
      position: absolute;
      top: -20%;
      left: -130%;
      width: 65%;
      height: 140%;
      pointer-events: none;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(233, 213, 255, 0.09),
        rgba(255, 255, 255, 0.2),
        rgba(233, 213, 255, 0.09),
        transparent
      );
      transform: skewX(-24deg);
      animation: glassWaveSweep 8s cubic-bezier(0.37, 0, 0.63, 1) infinite;
    }

    @keyframes liquidEmerge {
      0% {
        opacity: 0;
        border-radius: 120px;
        transform: translateY(34px) scale(0.92, 1.04);
      }
      55% {
        opacity: 1;
        border-radius: 28px 44px 32px 42px;
        transform: translateY(-6px) scale(1.015, 0.99);
      }
      100% {
        opacity: 1;
        border-radius: 36px;
        transform: translateY(0) scale(1, 1);
      }
    }

    @keyframes shellRippleIdle {
      0%, 100% {
        border-radius: 36px 34px 38px 35px;
      }
      50% {
        border-radius: 34px 38px 35px 37px;
      }
    }

    @keyframes glassWaveSweep {
      0% {
        left: -130%;
      }
      42%, 100% {
        left: 170%;
      }
    }

    .top-bar {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border-glass);
      padding-bottom: 16px;
      margin-bottom: 16px;
    }

    .title-group h1 {
      font-size: var(--title-fs);
      font-weight: 700;
      letter-spacing: -0.015em;
      color: var(--text-primary);
      margin-bottom: 4px;
      text-shadow: 0 0 22px rgba(216, 180, 254, 0.4);
    }

    .title-group p {
      font-size: var(--sub-fs);
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .pill-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .glass-pill {
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 8px 15px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: transform 0.26s cubic-bezier(0.22, 1.4, 0.36, 1), background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .pill-badge {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.32), rgba(107, 33, 168, 0.26));
      border: 1px solid var(--border-bright);
      color: #fdf8ff;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 0 18px rgba(168, 85, 247, 0.25);
    }

    .pill-sound {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--border-glass);
      color: var(--text-secondary);
      cursor: pointer;
    }

    .pill-sound:hover {
      transform: translateY(-2px) scale(1.03);
      border-color: var(--border-bright);
      color: #ffffff;
    }

    .pill-sound:active {
      transform: scale(0.93);
    }

    .pill-sound.active {
      background: linear-gradient(135deg, rgba(192, 132, 252, 0.34), rgba(126, 34, 206, 0.32));
      border-color: var(--border-bright);
      color: #ffffff;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 0 20px rgba(192, 132, 252, 0.35);
    }

    .stream-well {
      height: var(--chat-h);
      overflow-y: auto;
      border-radius: 28px;
      background: var(--glass-input);
      backdrop-filter: blur(var(--blur-card)) saturate(165%);
      -webkit-backdrop-filter: blur(var(--blur-card)) saturate(165%);
      border: 1px solid var(--border-glass);
      box-shadow: inset 0 4px 24px rgba(0, 0, 0, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.14);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 16px;
      scroll-behavior: smooth;
    }

    .stream-well::-webkit-scrollbar {
      width: 7px;
    }

    .stream-well::-webkit-scrollbar-track {
      background: transparent;
      margin: 12px 0;
    }

    .stream-well::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: rgba(216, 180, 254, 0.36);
    }

    .droplet {
      max-width: 88%;
      padding: 13px 18px;
      font-size: var(--msg-fs);
      line-height: 1.58;
      white-space: pre-wrap;
      backdrop-filter: blur(var(--blur-card)) saturate(170%);
      -webkit-backdrop-filter: blur(var(--blur-card)) saturate(170%);
      transition: transform 0.35s cubic-bezier(0.22, 1.35, 0.36, 1), box-shadow 0.3s ease;
    }

    .droplet:hover {
      transform: translateY(-2px);
    }

    .droplet.bot {
      align-self: flex-start;
      border-radius: 24px 24px 24px 8px;
      background: linear-gradient(145deg, var(--glass-card), rgba(22, 12, 48, 0.72));
      border: 1px solid var(--border-glass);
      box-shadow:
        inset 0 1.5px 0 rgba(255, 255, 255, 0.22),
        0 10px 28px rgba(0, 0, 0, 0.35);
      color: var(--text-primary);
      animation: liquidDropLeft 0.52s cubic-bezier(0.22, 1.42, 0.36, 1) both;
    }

    .droplet.bot.flowing {
      border-radius: 22px 28px 24px 10px;
      border-color: var(--border-bright);
      box-shadow:
        inset 0 1.5px 0 rgba(255, 255, 255, 0.3),
        0 0 28px rgba(192, 132, 252, 0.34);
    }

    .droplet.user {
      align-self: flex-end;
      border-radius: 24px 24px 8px 24px;
      background: linear-gradient(145deg, var(--glass-user), rgba(44, 16, 90, 0.78));
      border: 1px solid var(--border-bright);
      box-shadow:
        inset 0 1.5px 0 rgba(255, 255, 255, 0.28),
        0 12px 30px rgba(126, 34, 206, 0.28);
      color: #ffffff;
      animation: liquidDropRight 0.48s cubic-bezier(0.22, 1.42, 0.36, 1) both;
    }

      0% {

        border-radius: 999px;
        transform: translate3d(-18
