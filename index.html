<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>From Russia to Pakistan? — Official CBA Bot</title>
  <style>
    :root {
      --bg-void: #05030b;
      --bg-deep: #100722;
      --bg-mid: #1c0c3d;
      --bg-peak: #2a1057;
      --glass-shell: rgba(18, 11, 38, 0.64);
      --glass-card: rgba(35, 19, 72, 0.62);
      --glass-user: rgba(62, 24, 116, 0.72);
      --glass-input: rgba(9, 6, 20, 0.72);
      --border-glass: rgba(216, 180, 254, 0.32);
      --border-bright: rgba(216, 180, 254, 0.78);
      --border-neon: #a855f7;
      --text-primary: #fcfaff;
      --text-secondary: #e2d4fc;
      --text-muted: #b39ddb;
      --blur-heavy: 28px;
      --blur-card: 18px;
      --outer-pad: 22px;
      --inner-pad: 24px;
      --chat-h: 440px;
      --title-fs: 25px;
      --sub-fs: 13.5px;
      --msg-fs: 14.5px;
    }

    html[data-device="tablet"] {
      --outer-pad: 16px;
      --inner-pad: 20px;
      --chat-h: 390px;
      --title-fs: 22px;
      --sub-fs: 13px;
      --msg-fs: 14px;
    }

    html[data-device="mobile"] {
      --outer-pad: 10px;
      --inner-pad: 14px;
      --chat-h: 350px;
      --title-fs: 19px;
      --sub-fs: 12.5px;
      --msg-fs: 13.5px;
      --blur-heavy: 20px;
      --blur-card: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 14% 16%, rgba(168, 85, 247, 0.42), transparent 44%),
        radial-gradient(circle at 86% 22%, rgba(192, 132, 252, 0.28), transparent 46%),
        radial-gradient(circle at 52% 92%, rgba(126, 34, 206, 0.34), transparent 52%),
        linear-gradient(155deg, var(--bg-void) 0%, var(--bg-deep) 48%, var(--bg-mid) 100%);
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: var(--outer-pad);
      overflow-x: hidden;
    }

    .aurora-layer {
      position: fixed;
      inset: -25%;
      pointer-events: none;
      z-index: 0;
      background:
        conic-gradient(from 110deg at 50% 50%,
          rgba(147, 51, 234, 0.16),
          rgba(88, 28, 135, 0.06),
          rgba(192, 132, 252, 0.18),
          rgba(59, 7, 100, 0.08),
          rgba(147, 51, 234, 0.16));
      filter: blur(48px);
      animation: auroraDrift 18s ease-in-out infinite alternate;
    }

    @keyframes auroraDrift {
      0% {
        transform: translate3d(-2%, -2%, 0) rotate(0deg) scale(1);
      }
      50% {
        transform: translate3d(2%, 1%, 0) rotate(6deg) scale(1.06);
      }
      100% {
        transform: translate3d(-1%, 3%, 0) rotate(-4deg) scale(1.03);
      }
    }

    .grid-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        linear-gradient(to right, rgba(216, 180, 254, 0.055) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(216, 180, 254, 0.055) 1px, transparent 1px);
      background-size: 42px 42px;
      animation: gridPulse 7s ease-in-out infinite;
    }

    @keyframes gridPulse {
      0%, 100% {
        opacity: 0.65;
      }
      50% {
        opacity: 1;
      }
    }

    .glass-shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 900px;
      background: var(--glass-shell);
      backdrop-filter: blur(var(--blur-heavy)) saturate(170%);
      -webkit-backdrop-filter: blur(var(--blur-heavy)) saturate(170%);
      border: 1.5px solid var(--border-bright);
      box-shadow:
        0 24px 70px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.22),
        0 0 42px rgba(168, 85, 247, 0.28);
      padding: var(--inner-pad);
      overflow: hidden;
      animation: shellBoot 0.65s cubic-bezier(0.16, 1, 0.3, 1) both, shellBreath 6s ease-in-out 0.7s infinite;
    }

    .glass-shell::before {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 65%;
      height: 100%;
      pointer-events: none;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(233, 213, 255, 0.08),
        rgba(255, 255, 255, 0.14),
        rgba(233, 213, 255, 0.08),
        transparent
      );
      transform: skewX(-22deg);
      animation: lightSweep 8.5s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }

    @keyframes shellBoot {
      0% {
        opacity: 0;
        transform: translateY(22px) scale(0.98);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes shellBreath {
      0%, 100% {
        box-shadow:
          0 24px 70px rgba(0, 0, 0, 0.65),
          inset 0 1px 0 rgba(255, 255, 255, 0.22),
          0 0 36px rgba(168, 85, 247, 0.24);
      }
      50% {
        box-shadow:
          0 28px 78px rgba(0, 0, 0, 0.7),
          inset 0 1px 0 rgba(255, 255, 255, 0.3),
          0 0 54px rgba(192, 132, 252, 0.38);
      }
    }

    @keyframes lightSweep {
      0% {
        left: -120%;
      }
      45%, 100% {
        left: 165%;
      }
    }

    .top-header {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      border-bottom: 1px solid var(--border-glass);
      padding-bottom: 14px;
      margin-bottom: 16px;
    }

    .title-wrap h1 {
      font-size: var(--title-fs);
      font-weight: 700;
      letter-spacing: -0.015em;
      color: var(--text-primary);
      margin-bottom: 4px;
      text-shadow: 0 0 18px rgba(192, 132, 252, 0.35);
    }

    .title-wrap p {
      font-size: var(--sub-fs);
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .status-cluster {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .official-tag {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 6px 11px;
      background: linear-gradient(135deg, rgba(147, 51, 234, 0.36), rgba(88, 28, 135, 0.32));
      border: 1px solid var(--border-bright);
      color: #faf5ff;
      box-shadow: 0 0 16px rgba(168, 85, 247, 0.25);
    }

    .sound-toggle {
      font-size: 11.5px;
      font-weight: 600;
      padding: 6px 11px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-glass);
      color: var(--text-secondary);
      cursor: pointer;
      transition: transform 0.16s ease, background 0.2s ease, border-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    }

    .sound-toggle:hover {
      transform: translateY(-1px);
      border-color: var(--border-bright);
      color: #ffffff;
    }

    .sound-toggle:active {
      transform: scale(0.96);
    }

    .sound-toggle.active {
      background: rgba(168, 85, 247, 0.32);
      border-color: var(--border-bright);
      color: #ffffff;
      box-shadow: 0 0 14px rgba(168, 85, 247, 0.3);
    }

    .chat-stage {
      height: var(--chat-h);
      overflow-y: auto;
      background: var(--glass-input);
      backdrop-filter: blur(var(--blur-card)) saturate(150%);
      -webkit-backdrop-filter: blur(var(--blur-card)) saturate(150%);
      border: 1px solid var(--border-glass);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 16px;
      scroll-behavior: smooth;
    }

    .chat-stage::-webkit-scrollbar {
      width: 6px;
    }

    .chat-stage::-webkit-scrollbar-track {
      background: rgba(9, 6, 20, 0.55);
    }

    .chat-stage::-webkit-scrollbar-thumb {
      background: rgba(192, 132, 252, 0.42);
    }

    .bubble {
      max-width: 89%;
      padding: 12px 15px;
      font-size: var(--msg-fs);
      line-height: 1.56;
      white-space: pre-wrap;
      backdrop-filter: blur(var(--blur-card)) saturate(155%);
      -webkit-backdrop-filter: blur(var(--blur-card)) saturate(155%);
      animation: bubblePopIn 0.38s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes bubblePopIn {
      0% {
        opacity: 0;
        transform: translateY(14px) scale(0.96);
        box-shadow: 0 0 0 rgba(192, 132, 252, 0);
      }
      55% {
        opacity: 1;
        box-shadow: 0 0 22px rgba(192, 132, 252, 0.32);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        box-shadow: 0 0 12px rgba(147, 51, 234, 0.14);
      }
    }

    .bubble.bot {
      align-self: flex-start;
      background: linear-gradient(145deg, var(--glass-card), rgba(20, 11, 44, 0.72));
      border: 1px solid var(--border-glass);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16);
      color: var(--text-primary);
    }

    .bubble.bot.typing-active {
      border-color: var(--border-bright);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.22),
        0 0 24px rgba(168, 85, 247, 0.3);
    }

    .bubble.user {
      align-self: flex-end;
      background: linear-gradient(145deg, var(--glass-user), rgba(36, 14, 74, 0.78));
      border: 1px solid var(--border-bright);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.22),
        0 0 18px rgba(147, 51, 234, 0.22);
      color: #ffffff;
    }

    .typing-dots {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 18px;
      padding: 0 2px;
    }

    .typing-dots span {
      width: 7px;
      height: 7px;
      background: #f3e8ff;
      box-shadow: 0 0 10px rgba(216, 180, 254, 0.85);
      display: inline-block;
      animation: waveDot 1.15s infinite ease-in-out;
    }

    .typing-dots span:nth-child(2) {
      animation-delay: 0.16s;
    }

    .typing-dots span:nth-child(3) {
      animation-delay: 0.32s;
    }

    @keyframes waveDot {
      0%, 75%, 100% {
        opacity: 0.25;
        transform: translateY(0) scale(0.88);
      }
      38% {
        opacity: 1;
        transform: translateY(-4px) scale(1.15);
      }
    }

    .cursor-caret {
      display: inline-block;
      width: 2.5px;
      height: 1.05em;
      background: #f3e8ff;
      box-shadow: 0 0 10px rgba(216, 180, 254, 0.9);
      margin-left: 2px;
      vertical-align: -0.14em;
      animation: caretFlash 0.7s steps(1, end) infinite;
    }

    @keyframes caretFlash {
      50% {
        opacity: 0;
      }
    }

    .meta-footer {
      display: block;
      margin-top: 7px;
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.03em;
    }

    .composer {
      display: flex;
      background: var(--glass-input);
      border: 1.5px solid var(--border-glass);
      transition: border-color 0.22s ease, box-shadow 0.22s ease, transform 0.18s ease;
    }

    .composer:focus-within {
      border-color: var(--border-bright);
      box-shadow:
        0 0 24px rgba(168, 85, 247, 0.36),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    .composer.pulse-send {
      transform: scale(0.992);
      box-shadow: 0 0 32px rgba(216, 180, 254, 0.5);
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      font-size: var(--msg-fs);
      background: transparent;
      color: var(--text-primary);
      border: none;
      outline: none;
    }

    input[type="text"]::placeholder {
      color: var(--text-muted);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="aurora-layer" aria-hidden="true"></div>
  <div class="grid-overlay" aria-hidden="true"></div>

  <main class="glass-shell">
    <header class="top-header">
      <div class="title-wrap">
        <h1>From Russia to Pakistan?</h1>
        <p>Checking old maps and history records for the Ghuman family</p>
      </div>
      <div class="status-cluster">
        <span class="official-tag">Official CBA Bot</span>
        <button type="button" id="soundToggle" class="sound-toggle active" aria-pressed="true">Sound: On</button>
      </div>
    </header>

    <section id="chatStage" class="chat-stage" aria-live="polite">
      <div class="bubble bot">
        I am a bot to answer questions and answers according to the CBA of history from russian to pakistan migration.
        <span class="meta-footer">Created by: Mohammad Hassan</span>
      </div>
    </section>

    <form id="composerForm" class="composer">
      <input
        type="text"
        id="questionInput"
        placeholder="Ask anything about the CBA history presentation and press Enter..."
        autocomplete="off"
        required
      />
    </form>
  </main>

  <script>
    const CREATOR_NAME = "Mohammad Hassan";
    const BOT_IDENTITY = "I am a bot to answer questions and answers according to the CBA of history from russian to pakistan migration.";

    const FULL_CBA_KNOWLEDGE = `
Presentation Title: From Russia to Pakistan? Checking old maps and history records for the Ghuman family. Created by: Mohammad Hassan.

Full Slide-by-Slide Facts & Sources:
1. Main Question: Family stories say early people moved south from Russia to Pakistan. History books and maps check that claim with real records. (Family Oral Records; Britannica Eurasia Geography)
2. 4,500 Kilometers Across Asia: Russia to Punjab is more than 4,500 kilometers across cold land and high mountains. Long ago travelers walked or rode pack animals on those trips. (Encyclopaedia Britannica World Atlas)
3. Moving One Step at a Time: Big moves across Asia took many years and many families. People stayed near good water and crops for years before moving on. (UNESCO Silk Roads Programme)
4. Spoken Stories and Written Books: The Russia story has no dates or written papers. Old Punjab books list the Ghuman clan in Delhi, Jammu, and Sialkot. (Sialkot District Gazetteer, 1894)
5. Cold Weather and Moving South: One idea says cold weather pushed people south from Russia toward South Asia. Cold weather moved groups in history, but no record ties that trip to the Ghuman family. (Encyclopaedia Britannica Climate History)
6. What Historians Need for Proof: History proof needs real dates, place names, and written records with the family name. Right now no written record shows the Ghuman family leaving Russia. (The National Archives Historical Research Guide)
7. Three Checks for Any Move: Historians check three things: when people moved, which towns they passed, and written books listing the name. (FamilySearch Genealogical Proof Standard)
8. Why Families Moved in History: People moved in history for good farm land, trade, wars, or bad droughts with little water. (Encyclopaedia Britannica Human Migration)
9. Central Asia in the Middle: Central Asia sits between northern Asia and South Asia. For over 2,000 years travelers passed through towns like Samarkand and Bukhara. (UNESCO Silk Roads Programme)
10. Old Trade Roads Across Asia: Silk Roads linked Central Asia, Afghanistan, and northern India. Travelers carried goods like silk, spices, and horses along these paths for hundreds of years. (UNESCO Silk Roads Programme)
11. Mountain Paths Into Punjab: High mountains sit between Central Asia and Punjab. Travelers crossed through mountain gaps like the Khyber Pass to reach the plains. (Encyclopaedia Britannica Khyber Pass)
12. Four Parts of Long Trips: Long land trips had four parts: wide open plains, Central Asia towns, mountain passes, and river land in Punjab. (UNESCO Silk Roads Programme)
13. Road Maps Are Not Family Proof: Old trade roads show people could travel across Asia, but they do not prove one family walked from Russia. Records must name the family. (The National Archives Historical Research Guide)
14. Written Books in South Asia: Written books in South Asia name the Ghuman group in northern India and Punjab. Old district books list real villages and family branches. (A Glossary of the Tribes and Castes of the Punjab, 1911)
15. From Delhi and Jammu to Sialkot: Punjab books say early ancestors lived near Delhi before Raja Sanpal Janjua moved to Jammu. His descendant Raja Ghumman moved into Sialkot and started the Ghuman home. (Sialkot District Gazetteer, 1894)
16. Villages Near Five Rivers: Punjab gets its name from five rivers that water good wheat farms. From Sialkot, 21 Ghuman branches built farms in Gujranwala, Gurdaspur, Amritsar, and Lyallpur. (A Glossary of the Tribes and Castes of the Punjab, 1911)
17. 1911 Census Numbers: The 1911 Census counted 7,579 Ghuman people in Sialkot District alone. More than twelve villages in Gurdaspur and Sangrur also had the Ghuman name. (Census of India 1911, Punjab Volume XIV)
18. Different Spellings in Books: Writers spelled the name as Ghuman, Ghumman, or Ghamman across languages. Similar place names in other places do not prove shared family roots without records. (FamilySearch Name Spelling Guide)
19. The 1947 Split of Punjab: In August 1947 a new border split Punjab between Pakistan and India. Many families had to leave their homes quickly when the border line was drawn. (The National Archives UK Partition Records)
20. 14 Million People on the Move: About 14 million people crossed the new borders in 1947. People rode trains, carts, and walked in large groups recorded in government files and photos. (Encyclopaedia Britannica Partition of India)
21. How 1947 Split Ghuman Towns: Before 1947, Muslim and Sikh Ghuman families lived near each other in Punjab. The border put Sialkot in Pakistan and Gurdaspur in India, moving families across. (Punjab Partition Resettlement Records)
22. Talking to Elders and Saving Papers: Older family members remember village names, land papers, and old photos not in school books. Writing down who spoke and when helps check stories. (Oral History Society Guidelines)
23. Four Main Record Sets Used: 1911 Punjab Census, Sialkot and Gurdaspur district books, UK 1947 files, and FamilySearch records. (National Archives and Census of India)
24. Checking Every Map and Source: Each source was checked for author, year, and written proof. Arrows only belong where records show real travel, and unknown dates stay unknown. (National Geographic Historical Cartography Standards)
25. Proven Facts vs. Unproven Ideas: The 1947 move is proven, the Delhi and Jammu to Sialkot path is in Punjab books, and a trip from Russia is not proven. (Sialkot Gazetteer and UK National Archives)
26. Moving to Other Countries After 1950: Starting in the 1950s, Ghuman families moved from Punjab to Britain, Ireland, Canada, the US, and Gulf countries, shown in travel records. (UK National Archives Passenger Lists)
27. Checking Family Trees Online: FamilySearch and Ancestry hold old birth and land pages; historians check real scanned pages rather than unverified user guesses. (FamilySearch Research Wiki)
28. Key Dates in the Record: Punjab books trace movement to Sialkot, 1911 counts 7,579 Ghuman people in Sialkot District, and 1947 brings the Partition border move. (Census of India 1911 and Sialkot Gazetteer)
29. Gujranwala and Gurdaspur Farms: Ghuman families farmed across Gujranwala and Gurdaspur before 1947; district books record villages, crops, and local family ties in central Punjab. (Punjab District Gazetteers)
30. Reading Old Maps Carefully: Checking the map year prevents mixing old roads with modern country lines. (National Geographic Historical Cartography Standards)
31. What History Records Show: Census books, local gazetteers, and 1947 files show Punjab and the border clearly. (History CBA Research Synthesis)
32. Sources: Census of India 1911 (Punjab Volume XIV); Punjab District Gazetteers (Sialkot and Gurdaspur); The National Archives (UK); UNESCO Silk Roads Programme; Encyclopaedia Britannica; FamilySearch and Ancestry Archives.
`.trim();

    const SYSTEM_RULES = `
You are the official Q&A bot for a school history CBA presentation.
${FULL_CBA_KNOWLEDGE}

Strict Rules:
1. Never say you are Gemini, Google AI, or an AI model. If asked who or what you are, respond with: "${BOT_IDENTITY}"
2. If asked who created the presentation, who made it, or anything about the creator/author, answer that ${CREATOR_NAME} created the presentation.
3. Users may ask using casual slang, abbreviations, typos, or informal phrasing (e.g., "who made dis", "when did ppl move", "wat abt 1947", "cap or legit", "wats da proof", "u gemini?"). Understand their intent clearly and respond using the CBA facts and historical context.
4. Answer questions thoroughly and clearly using the CBA facts above plus historical knowledge about Eurasia/Russia, Central Asia, Silk Roads, Khyber Pass, Punjab, the 1894 Gazetteer, the 1911 Census, the August 1947 Partition, post-1950 migration, and historical/archival methods.
5. If a question is clearly unrelated to these topics (such as video games, sports, cooking, movies, anime, weather, or unrelated homework), reply strictly with: Question not related
6. Remember earlier messages from both the user and assistant in this conversation.
`.trim();

    // Slang, shorthand, and typo normalization so intent is caught even if an API is slow/offline
    const SLANG_REPLACEMENTS = [
      [/\bwho\s+(made|built|did|cooked up|dropped|put together)\s+(dis|this|da|it|pres|presentation|cba)\b/gi, "who created this presentation"],
      [/\b(u|ur|yu|r u|are u)\s+(gemini|google|ai|a bot|bot)\b/gi, "who are you"],
      [/\b(wat|wut|whut|wt|wht)\b/gi, "what"],
      [/\b(da|dis|dat|dem|dey|ppl|peeps)\b/gi, "the people"],
      [/\b(rn|fr|ngl|tbh|idk|idc|smh|bet|legit|cap|no cap|sus)\b/gi, " "],
      [/\b(abt|bout|ab)\b/gi, "about"],
      [/\b(bcz|bc|cuz|cos|coz|y|whyy)\b/gi, "why"],
      [/\b(wen|whn|wenever)\b/gi, "when"],
      [/\b(whr|wer|wherez)\b/gi, "where"],
      [/\b(ppl|peeps|folks|fam)\b/gi, "people"],
      [/\b(movin|moving|moved|bounced|dip|dipped|left|travellin|traveling|traveled)\b/gi, "migration"],
      [/\b(pak|pkstn)\b/gi, "pakistan"],
      [/\b(rus|rusia|russiaa)\b/gi, "russia"],
      [/\b(punjb|punjaab)\b/gi, "punjab"],
      [/\b(ghumanz|ghumann|ghamaan|ghummanz)\b/gi, "ghuman"]
    ];

    function normalizeSlang(raw) {
      let out = (raw || "").toLowerCase().trim();
      for (const [pattern, replacement] of SLANG_REPLACEMENTS) {
        out = out.replace(pattern, replacement);
      }
      return out.replace(/\s+/g, " ").trim();
    }

    const DETAILED_TOPICS = [
      {
        terms: ["when", "date", "year", "time", "how long", "happen", "happened", "timeline", "old", "century", "centuries", "ago"],
        reply: `${BOT_IDENTITY} The Russia-to-Pakistan migration story has no proven date or written record showing the Ghuman family leaving Russia. In the records covered in the presentation: the Sialkot District Gazetteer is from 1894 (recording early movement via Delhi and Jammu to Sialkot), the Punjab Census with Ghuman counts is from 1911, the Partition of Punjab happened in August 1947 (with around 14 million people crossing new borders), and wider migration to places like Britain, Ireland, Canada, the US, and Gulf countries began starting in the 1950s.`
      },
      {
        terms: ["russia", "4,500", "4500", "cold", "eurasia", "silk road", "samarkand", "bukhara", "khyber", "mountain", "steppe", "route", "corridor", "migrate", "migration", "drought", "trade", "war", "km", "kilometers"],
        reply: `${BOT_IDENTITY} Russia to Punjab spans more than 4,500 kilometers across cold land, open plains, mountain passes, and river valleys. Travelers and traders moved over long periods—passing through hubs like Samarkand and Bukhara along Silk Roads and mountain gaps like the Khyber Pass—often staying near water and crops for years. Even so, old trade routes show travel across Asia was possible; they do not prove the Ghuman family walked from Russia without written records naming the family.`

    function getAudioContext() {
      if (!soundEnabled) return null;

      if (!audioCtx) {

    function playSynthTone(freq, duration, type = "sine", gainPeak = 0.04, delay = 0, slideTo = null) {
      const ctx = getAudioContext();
      if (!ctx) return;

      const t0 = ctx.currentTime + delay;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      if (slideTo !== null) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(40, slideTo), t0 + duration);
      }

      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(gainPeak, t0 + 0.014);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(t0);
      osc.stop(t0 + duration + 0.025);
    }

        box.appendChild(metaSpan);
        chatStage.appendChild(box);

        let idx = 0;
        const speed = text.length > 260 ? 10 : 14;

        function step() {
          if (idx < text.length) {
            textSpan.textContent += text.charAt(idx);
            if (idx % 2 === 0) {

            setTimeout(step, speed);

            metaSpan.style.opacity = "1";
            playArrivalChord();
            chatStage.scrollTop = chatStage.scrollHeight;
            resolve();
          }
        }

        step();
      });
    }
