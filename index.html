<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>From Russia to Pakistan?</title>
  <style>
    :root {
      --bg-base: #0a0c10;
      --bg-elevated: #121620;
      --bg-card: #161b28;
      --bg-user: #142230;
      --border-main: #2d3548;
      --border-accent: #7c8aa6;
      --text-primary: #f3f5f8;
      --text-secondary: #b6c0d4;
      --text-muted: #8893a8;
      --shell-max-w: 840px;
      --outer-pad: 24px;
      --inner-pad: 24px;
      --chat-h: 400px;
      --title-size: 24px;
      --subtitle-size: 14px;
      --msg-size: 14.5px;
    }

    html[data-device="tablet"] {
      --shell-max-w: 720px;
      --outer-pad: 18px;
      --inner-pad: 20px;
      --chat-h: 360px;
      --title-size: 21px;
      --subtitle-size: 13.5px;
      --msg-size: 14px;
    }

    html[data-device="mobile"] {
      --shell-max-w: 100%;
      --outer-pad: 10px;
      --inner-pad: 14px;
      --chat-h: 320px;
      --title-size: 19px;
      --subtitle-size: 13px;
      --msg-size: 13.5px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0;
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(180deg, #090b0f 0%, #10141e 55%, #0b0e14 100%);
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: var(--outer-pad);
    }

    .frame {
      width: 100%;
      max-width: var(--shell-max-w);
      background: var(--bg-elevated);
      border: 2px solid var(--border-accent);
      padding: var(--inner-pad);
    }

    .head {
      border-bottom: 1px solid var(--border-main);
      padding-bottom: 14px;
      margin-bottom: 16px;
    }

    .head h1 {
      font-size: var(--title-size);
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 5px;
    }

    .head p {
      font-size: var(--subtitle-size);
      color: var(--text-secondary);
      line-height: 1.45;
    }

    .log {
      height: var(--chat-h);
      overflow-y: auto;
      background: var(--bg-base);
      border: 1px solid var(--border-main);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }

    .entry {
      max-width: 90%;
      padding: 12px 14px;
      font-size: var(--msg-size);
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .entry.bot {
      align-self: flex-start;
      background: var(--bg-card);
      border: 1px solid var(--border-main);
      color: var(--text-primary);
    }

    .entry.user {
      align-self: flex-end;
      background: var(--bg-user);
      border: 1px solid #3c5673;
      color: var(--text-primary);
    }

    .source-line {
      display: block;
      margin-top: 6px;
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .form-box {
      display: flex;
    }

    input[type="text"] {
      width: 100%;
      padding: 13px 14px;
      font-size: var(--msg-size);
      background: var(--bg-base);
      color: var(--text-primary);
      border: 1px solid var(--border-accent);
      outline: none;
    }

    input[type="text"]::placeholder {
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <main class="frame">
    <header class="head">
      <h1>From Russia to Pakistan?</h1>
      <p>Checking old maps and history records for the Ghuman family</p>
    </header>

    <section id="log" class="log" aria-live="polite">
      <div class="entry bot">
        I am a bot to answer questions and answers according to the CBA of history from russian to pakistan migration.
        <span class="source-line">Created by: Mohammad Hassan</span>
      </div>
    </section>

    <form id="askForm" class="form-box">
      <input
        type="text"
        id="questionInput"
        placeholder="Type a question and press Enter..."
        autocomplete="off"
        required
      />
    </form>
  </main>

  <script>
    const CREATOR_NAME = "Mohammad Hassan";
    const BOT_IDENTITY = "I am a bot to answer questions and answers according to the CBA of history from russian to pakistan migration.";

    const DECK_FACTS = `
Title: From Russia to Pakistan? Checking old maps and history records for the Ghuman family. Created by: Mohammad Hassan.
- Main Question: Family stories say early people moved south from Russia to Pakistan. History books and maps check that claim with real records. (Family Oral Records; Britannica Eurasia Geography)
- Distance & Pace: Russia to Punjab is more than 4,500 kilometers across cold land and high mountains; travelers walked or rode pack animals. Big moves took many years and families stayed near water and crops before moving on. (Encyclopaedia Britannica World Atlas; UNESCO Silk Roads Programme)
- Oral Stories vs Written Books: The Russia story has no dates or written papers. Old Punjab books list the Ghuman clan in Delhi, Jammu, and Sialkot. (Sialkot District Gazetteer, 1894)
- Proof & Checks: Historians need real dates, place names, and written records with the family name; right now no written record shows the Ghuman family leaving Russia. Three checks: when people moved, which towns they passed, and written books listing the name. (The National Archives Historical Research Guide; FamilySearch Genealogical Proof Standard)
- Reasons for Migration: Good farm land, trade, wars, or bad droughts with little water. (Encyclopaedia Britannica Human Migration)
- Eurasia & Silk Roads: Central Asia sits between northern Asia and South Asia (Samarkand and Bukhara for over 2,000 years); Silk Roads linked Central Asia, Afghanistan, and northern India; mountain gaps like the Khyber Pass reach the plains; four parts of long land trips: wide open plains, Central Asia towns, mountain passes, and river land in Punjab. Road maps show travel was possible, not that one family walked from Russia. (UNESCO Silk Roads Programme; Encyclopaedia Britannica Khyber Pass; The National Archives)
- Written Books & Settlement in Punjab: A Glossary of the Tribes and Castes of the Punjab (1911) names the Ghuman group in northern India and Punjab and lists real villages and family branches. Sialkot District Gazetteer (1894) says early ancestors lived near Delhi before Raja Sanpal Janjua moved to Jammu, and his descendant Raja Ghumman moved into Sialkot and started the Ghuman home. From Sialkot, 21 Ghuman branches built farms in Gujranwala, Gurdaspur, Amritsar, and Lyallpur.
- 1911 Census & Spellings: The 1911 Census counted 7,579 Ghuman people in Sialkot District alone, with more than twelve villages in Gurdaspur and Sangrur also having the Ghuman name. Spellings in books include Ghuman, Ghumman, or Ghamman. (Census of India 1911, Punjab Volume XIV; FamilySearch Name Spelling Guide)
- 1947 Partition & Later Moves: In August 1947 a new border split Punjab between Pakistan and India; about 14 million people crossed new borders in 1947; Sialkot was placed in Pakistan and Gurdaspur in India. Starting in the 1950s, Ghuman families moved from Punjab to Britain, Ireland, Canada, the US, and Gulf countries. (The National Archives UK Partition Records; Encyclopaedia Britannica Partition of India; Punjab Partition Resettlement Records; UK National Archives Passenger Lists)
- Methods & Sources: Talking to elders and saving papers; four main record sets (1911 Punjab Census, Sialkot and Gurdaspur district books, UK 1947 files, and FamilySearch/Ancestry records); checking map years; UNESCO Silk Roads Programme; Encyclopaedia Britannica; The National Archives (UK).
`.trim();

    const SYSTEM_RULES = `
You are answering questions for a school history CBA presentation.
${DECK_FACTS}

Rules:
1. Never say you are Gemini, Google AI, or an AI model. If asked who or what you are, state: "${BOT_IDENTITY}"
2. If asked who created the presentation, who made it, or anything about the creator/author, answer that ${CREATOR_NAME} created the presentation.
3. Only answer questions related to the CBA of history from Russia/Eurasia to Pakistan migration (Ghuman family migration, Eurasia routes, Punjab settlement, 1894 gazetteer, 1911 census, 1947 Partition, post-1950 migration, historical evidence/sources/maps, or the presentation/creator). If a question is unrelated, reply strictly with: Question not related
4. Remember earlier turns in this conversation and stay accurate and clear.
`.trim();

    const TOPIC_MATCHERS = [
      {
        terms: ["russia", "4,500", "4500", "cold", "eurasia", "silk road", "samarkand", "bukhara", "khyber", "mountain", "steppe", "route", "corridor", "migrate", "migration", "drought", "trade", "war"],
        reply: `${BOT_IDENTITY} The presentation notes that Russia to Punjab is more than 4,500 km across Eurasia, with routes through Central Asia, Silk Roads, and mountain gaps like the Khyber Pass, while no written record currently shows the Ghuman family leaving Russia.`
      },
      {
        terms: ["1894", "gazetteer", "1911", "census", "7,579", "7579", "sialkot", "gurdaspur", "gujranwala", "amritsar", "lyallpur", "sangrur", "jammu", "delhi", "sanpal", "ghumman", "ghuman", "punjab", "glossary", "21", "twelve"],
        reply: `${BOT_IDENTITY} Punjab records include the 1894 Sialkot District Gazetteer (traced via Delhi and Jammu to Sialkot), the 1911 Glossary naming 21 Ghuman branches across areas such as Gujranwala, Gurdaspur, Amritsar, and Lyallpur, and the 1911 Census counting 7,579 Ghuman people in Sialkot District.`
      },
      {
        terms: ["1947", "partition", "india", "pakistan", "14 million", "border", "1950", "britain", "ireland", "canada", "gulf", "train"],
        reply: `${BOT_IDENTITY} In August 1947 a new border split Punjab between Pakistan and India, with about 14 million people crossing new borders and Sialkot in Pakistan and Gurdaspur in India; from the 1950s onward, families also moved to places including Britain, Ireland, Canada, the US, and Gulf countries.`
      },
      {
        terms: ["source", "sources", "proof", "evidence", "archive", "archives", "familysearch", "ancestry", "oral", "elder", "map", "maps", "spelling", "ghauman", "ghamman", "check"],
        reply: `${BOT_IDENTITY} The presentation checks oral stories with elders against written records and maps—including the 1911 Census, district gazetteers, UK National Archives, UNESCO Silk Roads Programme, Encyclopaedia Britannica, and FamilySearch/Ancestry—while checking map years and spelling variants like Ghuman, Ghumman, and Ghamman.`
      }
    ];

    const UNRELATED_TERMS = [
      "minecraft", "roblox", "fortnite", "football", "soccer", "basketball", "cricket", "tennis",
      "recipe", "cook", "pizza", "pasta", "burger", "movie", "film", "anime", "song", "music",
      "tiktok", "weather", "temperature", "stock", "crypto", "bitcoin", "algebra", "geometry"
    ];

    const logEl = document.getElementById("log");
    const formEl = document.getElementById("askForm");
    const inputEl = document.getElementById("questionInput");

    let memory = [];

    function syncViewportLayout() {
      const w = window.innerWidth;
      const touch = navigator.maxTouchPoints > 0 || "ontouchstart" in window;
      let device = "desktop";
      if (w <= 640 || (touch && w <= 780)) {
        device = "mobile";
      } else if (w <= 1024) {
        device = "tablet";
      }
      document.documentElement.setAttribute("data-device", device);
    }

    syncViewportLayout();
    window.addEventListener("resize", syncViewportLayout);

    function asksCreator(q) {
      const t = q.toLowerCase();
      return (
        t.includes("who created") ||
        t.includes("who made") ||
        t.includes("who built") ||
        t.includes("created by") ||
        t.includes("creator") ||
        t.includes("author") ||
        t.includes("made this presentation") ||
        t.includes("who is behind")
      );
    }

    function asksIdentity(q) {
      const t = q.toLowerCase();
      return (
        t.includes("who are you") ||
        t.includes("what are you") ||
        t.includes("are you gemini") ||
        t.includes("gemini") ||
        t.includes("what model")
      );
    }

    function isClearlyUnrelated(q) {
      const t = q.toLowerCase();
      if (asksCreator(t) || asksIdentity(t)) return false;
      const allowedTopicWords = [
        "russia", "russian", "eurasia", "eurasian", "pakistan", "india", "punjab", "partition",
        "1947", "1911", "1894", "1950", "ghuman", "ghumman", "ghamman", "sialkot", "gurdaspur",
        "gujranwala", "amritsar", "lyallpur", "sangrur", "jammu", "delhi", "silk road", "khyber",
        "samarkand", "bukhara", "census", "gazetteer", "archive", "history", "historical", "cba",
        "migration", "migrate", "map", "maps", "source", "sources", "family", "oral", "presentation", "slide"
      ];
      if (allowedTopicWords.some((w) => t.includes(w))) return false;
      return UNRELATED_TERMS.some((w) => t.includes(w));
    }

    function pushMessage(text, who, note = "") {
      const box = document.createElement("div");
      box.className = `entry ${who}`;
      box.textContent = text;
      if (who === "bot" && note) {
        const sub = document.createElement("span");
        sub.className = "source-line";
        sub.textContent = note;
        box.appendChild(sub);
      }
      logEl.appendChild(box);
      logEl.scrollTop = logEl.scrollHeight;
      return box;
    }

    function normalizeModelReply(raw, q) {
      if (asksCreator(q)) return `${CREATOR_NAME} created this presentation.`;
      if (asksIdentity(q)) return BOT_IDENTITY;
      const clean = (raw || "").trim();
      if (!clean) return "Question not related";
      if (/^question not related[.!]?$/i.test(clean)) return "Question not related";
      return clean
        .replace(/\b(i am|i'm|as) (an? )?(gemini|google ai|large language model|language model)\b/gi, BOT_IDENTITY)
        .trim();
    }

    function fallbackFromDeck(q) {
      if (asksCreator(q)) return `${CREATOR_NAME} created this presentation.`;
      if (asksIdentity(q)) return BOT_IDENTITY;
      if (isClearlyUnrelated(q)) return "Question not related";

      const t = q.toLowerCase();
      let best = null;
      let bestScore = 0;

      for (const m of TOPIC_MATCHERS) {
        let score = 0;
        for (const term of m.terms) {
          if (t.includes(term)) score += 1;
        }
        if (score > bestScore) {
          bestScore = score;
          best = m;
        }
      }
      if (best && bestScore > 0) return best.reply;

      const priorUserText = memory
        .filter((item) => item.role === "user")
        .slice(-3)
        .map((item) => item.content.toLowerCase())
        .join(" ");

      for (const m of TOPIC_MATCHERS) {
        if (m.terms.some((term) => priorUserText.includes(term))) {
          return m.reply;
        }
      }

      return "Question not related";
    }

    async function fetchFreeModel(messages) {
      const response = await fetch("https://text.pollinations.ai/openai/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "openai",
          messages,
          temperature: 0.2
        })
      });
      if (!response.ok) throw new Error(`Status ${response.status}`);
      const json = await response.json();
      return json?.choices?.[0]?.message?.content || "";
    }

    async function answerQuestion(q) {
      if (asksCreator(q)) {
        return { text: `${CREATOR_NAME} created this presentation.`, note: "From Russia to Pakistan?" };
      }
      if (asksIdentity(q)) {
        return { text: BOT_IDENTITY, note: "From Russia to Pakistan?" };
      }
      if (isClearlyUnrelated(q)) {
        return { text: "Question not related", note: "From Russia to Pakistan?" };
      }

      const messages = [
        { role: "system", content: SYSTEM_RULES },
        ...memory.slice(-14),
        { role: "user", content: q }
      ];

      try {
        const raw = await fetchFreeModel(messages);
        return {
          text: normalizeModelReply(raw, q),
          note: "From Russia to Pakistan?"
        };
      } catch (_) {
        return {
          text: fallbackFromDeck(q),
          note: "From Russia to Pakistan?"
        };
      }
    }

    formEl.addEventListener("submit", async (e) => {
      e.preventDefault();
      const q = inputEl.value.trim();
      if (!q) return;

      inputEl.value = "";
      inputEl.disabled = true;

      pushMessage(q, "user");
      const waitingBox = pushMessage("Checking records...", "bot");

      const result = await answerQuestion(q);
      waitingBox.remove();

      pushMessage(result.text, "bot", result.note);

      memory.push({ role: "user", content: q });
      memory.push({ role: "assistant", content: result.text });

      inputEl.disabled = false;
      inputEl.focus();
    });
  </script>
</body>
</html>
