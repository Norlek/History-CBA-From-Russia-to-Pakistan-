<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>From Russia to Pakistan? — Official CBA Bot</title>
  <style>
    :root {
      --bg-void: #06030e;
      --bg-deep: #120826;
      --bg-purple-glow: #260b4b;
      --glass-shell: rgba(19, 10, 41, 0.54);
      --glass-card: rgba(41, 19, 84, 0.54);
      --glass-user: rgba(71, 25, 132, 0.64);
      --glass-input: rgba(10, 6, 22, 0.62);
      --border-glass: rgba(216, 180, 254, 0.34);
      --border-bright: rgba(233, 213, 255, 0.84);
      --text-primary: #fdfaff;
      --text-secondary: #e5d4ff;
      --text-muted: #b69ee3;
      --blur-heavy: 34px;
      --blur-card: 22px;
      --outer-pad: 22px;
      --inner-pad: 26px;
      --chat-h: 445px;
      --title-fs: 25px;
      --sub-fs: 13.5px;
      --msg-fs: 14.5px;
    }

    html[data-device="tablet"] {
      --outer-pad: 16px;
      --inner-pad: 22px;
      --chat-h: 395px;
      --title-fs: 22px;
      --sub-fs: 13px;
      --msg-fs: 14px;
    }

    html[data-device="mobile"] {
      --outer-pad: 12px;
      --inner-pad: 16px;
      --chat-h: 355px;
      --title-fs: 19px;
      --sub-fs: 12.5px;
      --msg-fs: 13.5px;
      --blur-heavy: 24px;
      --blur-card: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 16% 18%, rgba(126, 34, 206, 0.36), transparent 46%),
        radial-gradient(circle at 84% 22%, rgba(107, 33, 168, 0.28), transparent 48%),
        radial-gradient(circle at 52% 96%, rgba(147, 51, 234, 0.34), transparent 52%),
        linear-gradient(160deg, var(--bg-void) 0%, var(--bg-deep) 52%, var(--bg-purple-glow) 100%);
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: var(--outer-pad);
      overflow-x: hidden;
    }

    .liquid-backdrop {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    #liquidCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .touch-ripple {
      position: fixed;
      width: 24px;
      height: 24px;
      border-radius: 999px;
      pointer-events: none;
      z-index: 999;
      transform: translate(-50%, -50%) scale(0.2);
      border: 2px solid rgba(233, 213, 255, 0.88);
      background: radial-gradient(circle, rgba(216, 180, 254, 0.42), rgba(147, 51, 234, 0.06) 70%, transparent 100%);
      box-shadow: 0 0 24px rgba(192, 132, 252, 0.55), inset 0 0 12px rgba(255, 255, 255, 0.35);
      animation: liquidTouchExpand 0.68s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes liquidTouchExpand {
      0% {
        opacity: 0.95;
        transform: translate(-50%, -50%) scale(0.25, 0.35);
        border-radius: 55% 45% 60% 40% / 45% 55% 45% 55%;
      }
      55% {
        opacity: 0.65;
        border-radius: 44% 56% 42% 58% / 58% 42% 56% 44%;
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(4.2, 4.2);
        border-radius: 50%;
      }
    }

    .liquid-shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 900px;
      border-radius: 36px;
      background: var(--glass-shell);
      backdrop-filter: blur(var(--blur-heavy)) saturate(180%);
      -webkit-backdrop-filter: blur(var(--blur-heavy)) saturate(180%);
      border: 1.5px solid var(--border-bright);
      box-shadow:
        0 28px 80px rgba(0, 0, 0, 0.68),
        inset 0 2px 0 rgba(255, 255, 255, 0.28),
        inset 0 -10px 24px rgba(168, 85, 247, 0.14),
        0 0 48px rgba(147, 51, 234, 0.28);
      padding: var(--inner-pad);
      overflow: hidden;
      transition: transform 0.38s cubic-bezier(0.22, 1.45, 0.36, 1), box-shadow 0.35s ease;
      animation: liquidEmerge 0.82s cubic-bezier(0.22, 1.35, 0.36, 1) both, shellRippleIdle 7s ease-in-out 0.9s infinite;
    }

    .liquid-shell.liquid-jiggle {
      transform: scale(0.992, 1.008);
      box-shadow:
        0 30px 84px rgba(0, 0, 0, 0.72),
        inset 0 2px 0 rgba(255, 255, 255, 0.35),
        0 0 60px rgba(192, 132, 252, 0.42);
    }

    .liquid-shell::before {
      content: "";
      position: absolute;
      top: -20%;
      left: -130%;
      width: 65%;
      height: 140%;
      pointer-events: none;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(233, 213, 255, 0.09),
        rgba(255, 255, 255, 0.18),
        rgba(233, 213, 255, 0.09),
        transparent
      );
      transform: skewX(-24deg);
      animation: glassWaveSweep 8s cubic-bezier(0.37, 0, 0.63, 1) infinite;
    }

    @keyframes liquidEmerge {
      0% {
        opacity: 0;
        border-radius: 120px;
        transform: translateY(34px) scale(0.92, 1.04);
      }
      55% {
        opacity: 1;
        border-radius: 28px 44px 32px 42px;
        transform: translateY(-6px) scale(1.015, 0.99);
      }
      100% {
        opacity: 1;
        border-radius: 36px;
        transform: translateY(0) scale(1, 1);
      }
    }

    @keyframes shellRippleIdle {
      0%, 100% {
        border-radius: 36px 34px 38px 35px;
      }
      50% {
        border-radius: 34px 38px 35px 37px;
      }
    }

    @keyframes glassWaveSweep {
      0% {
        left: -130%;
      }
      42%, 100% {
        left: 170%;
      }
    }

    .top-bar {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border-glass);
      padding-bottom: 16px;
      margin-bottom: 16px;
    }

    .title-group h1 {
      font-size: var(--title-fs);
      font-weight: 700;
      letter-spacing: -0.015em;
      color: var(--text-primary);
      margin-bottom: 4px;
      text-shadow: 0 0 22px rgba(216, 180, 254, 0.4);
    }

    .title-group p {
      font-size: var(--sub-fs);
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .pill-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .glass-pill {
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 8px 15px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: transform 0.32s cubic-bezier(0.22, 1.55, 0.36, 1), background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .pill-badge {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.32), rgba(107, 33, 168, 0.26));
      border: 1px solid var(--border-bright);
      color: #fdf8ff;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 0 18px rgba(168, 85, 247, 0.25);
    }

    .pill-sound {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--border-glass);
      color: var(--text-secondary);
      cursor: pointer;
    }

    .pill-sound:hover {
      transform: translateY(-2px) scale(1.05, 0.96);
      border-color: var(--border-bright);
      color: #ffffff;
    }

    .pill-sound:active {
      transform: scale(0.88, 1.12);
    }

    .pill-sound.active {
      background: linear-gradient(135deg, rgba(192, 132, 252, 0.34), rgba(126, 34, 206, 0.32));
      border-color: var(--border-bright);
      color: #ffffff;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 0 20px rgba(192, 132, 252, 0.35);
    }

    .stream-well {
      height: var(--chat-h);
      overflow-y: auto;
      border-radius: 28px;
      background: var(--glass-input);
      backdrop-filter: blur(var(--blur-card)) saturate(165%);
      -webkit-backdrop-filter: blur(var(--blur-card)) saturate(165%);
      border: 1px solid var(--border-glass);
      box-shadow: inset 0 4px 24px rgba(0, 0, 0, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.14);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 16px;
      scroll-behavior: smooth;
    }

    .stream-well::-webkit-scrollbar {
      width: 7px;
    }

    .stream-well::-webkit-scrollbar-track {
      background: transparent;
      margin: 12px 0;
    }

    .stream-well::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: rgba(216, 180, 254, 0.36);
    }

    .droplet {
      max-width: 88%;
      padding: 13px 18px;
      font-size: var(--msg-fs);
      line-height: 1.58;
      white-space: pre-wrap;
      backdrop-filter: blur(var(--blur-card)) saturate(170%);
      -webkit-backdrop-filter: blur(var(--blur-card)) saturate(170%);
      transition: transform 0.36s cubic-bezier(0.22, 1.48, 0.36, 1), box-shadow 0.3s ease;
    }

    .droplet:hover {
      transform: translateY(-2px) scale(1.008);
    }

    .droplet:active {
      transform: scale(0.97, 1.03);
    }

    .droplet.bot {
      align-self: flex-start;
      border-radius: 24px 24px 24px 8px;
      background: linear-gradient(145deg, var(--glass-card), rgba(22, 12, 48, 0.72));
      border: 1px solid var(--border-glass);
      box-shadow:
        inset 0 1.5px 0 rgba(255, 255, 255, 0.22),
        0 10px 28px rgba(0, 0, 0, 0.35);
      color: var(--text-primary);
      animation: liquidDropLeft 0.52s cubic-bezier(0.22, 1.42, 0.36, 1) both;
    }

    .droplet.bot.flowing {
      border-radius: 22px 28px 24px 10px;
      border-color: var(--border-bright);
      box-shadow:
        inset 0 1.5px 0 rgba(255, 255, 255, 0.3),
        0 0 28px rgba(192, 132, 252, 0.34);
    }

    .droplet.user {
      align-self: flex-end;
      border-radius: 24px 24px 8px 24px;
      background: linear-gradient(145deg, var(--glass-user), rgba(44, 16, 90, 0.78));
      border: 1px solid var(--border-bright);
      box-shadow:
        inset 0 1.5px 0 rgba(255, 255, 255, 0.28),
        0 12px 30px rgba(126, 34, 206, 0.28);
      color: #ffffff;
      animation: liquidDropRight 0.48s cubic-bezier(0.22, 1.42, 0.36, 1) both;
    }

    @keyframes liquidDropLeft {
      0% {
        opacity: 0;
        border-radius: 999px;
        transform: translate3d(-18px, 18px, 0) scale(0.86, 1.12);
      }
      60% {
        opacity: 1;
        border-radius: 26px 22px 26px 10px;
        transform: translate3d(3px, -3px, 0) scale(1.03, 0.97);
      }
      100% {
        opacity: 1;
        border-radius: 24px 24px 24px 8px;
        transform: translate3d(0, 0, 0) scale(1, 1);
      }
    }

    @keyframes liquidDropRight {
      0% {
        opacity: 0;
        border-radius: 999px;
        transform: translate3d(18px, 18px, 0) scale(0.86, 1.12);
      }
      60% {
        opacity: 1;
        border-radius: 22px 26px 10px 26px;
        transform: translate3d(-3px, -3px, 0) scale(1.03, 0.97);
      }
      100% {
        opacity: 1;
        border-radius: 24px 24px 8px 24px;
        transform: translate3d(0, 0, 0) scale(1, 1);
      }
    }

    .liquid-dots {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 20px;
      padding: 0 4px;
    }

    .liquid-dots span {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 30%, #ffffff, #d8b4fe);
      box-shadow: 0 0 12px rgba(216, 180, 254, 0.85);
      display: inline-block;
      animation: dropletBounce 1.25s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }

    .liquid-dots span:nth-child(2) {
      animation-delay: 0.16s;
    }

    .liquid-dots span:nth-child(3) {
      animation-delay: 0.32s;
    }

    @keyframes dropletBounce {
      0%, 75%, 100% {
        opacity: 0.35;
        transform: translateY(0) scale(0.82, 1.15);
      }
      38% {
        opacity: 1;
        transform: translateY(-6px) scale(1.18, 0.86);
      }
    }

    .liquid-cursor {
      display: inline-block;
      width: 3px;
      height: 1.08em;
      border-radius: 999px;
      background: #f3e8ff;
      box-shadow: 0 0 12px rgba(233, 213, 255, 0.95);
      margin-left: 3px;
      vertical-align: -0.14em;
      animation: cursorFlow 0.8s ease-in-out infinite;
    }

    @keyframes cursorFlow {
      0%, 100% {
        opacity: 1;
        transform: scaleY(1);
      }
      50% {
        opacity: 0.2;
        transform: scaleY(0.65);
      }
    }

    .caption-meta {
      display: block;
      margin-top: 7px;
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.03em;
    }

    .liquid-dock {
      display: flex;
      border-radius: 999px;
      background: var(--glass-input);
      backdrop-filter: blur(var(--blur-card)) saturate(170%);
      -webkit-backdrop-filter: blur(var(--blur-card)) saturate(170%);
      border: 1.5px solid var(--border-glass);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 10px 26px rgba(0, 0, 0, 0.35);
      transition: border-color 0.25s ease, box-shadow 0.3s ease, transform 0.32s cubic-bezier(0.22, 1.5, 0.36, 1);
    }

    .liquid-dock:focus-within {
      border-color: var(--border-bright);
      transform: translateY(-1px) scale(1.008);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.28),
        0 0 28px rgba(192, 132, 252, 0.38);
    }

    .liquid-dock.splash {
      transform: scale(0.97, 1.035);
      box-shadow: 0 0 36px rgba(216, 180, 254, 0.55);
    }

    input[type="text"] {
      width: 100%;
      border-radius: 999px;
      padding: 15px 22px;
      font-size: var(--msg-fs);
      background: transparent;
      color: var(--text-primary);
      border: none;
      outline: none;
    }

    input[type="text"]::placeholder {
      color: var(--text-muted);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="liquid-backdrop" aria-hidden="true">
    <canvas id="liquidCanvas"></canvas>
  </div>

  <main class="liquid-shell" id="liquidShell">
    <header class="top-bar">
      <div class="title-group">
        <h1>From Russia to Pakistan?</h1>
        <p>Checking old maps and history records for the Ghuman family</p>
      </div>
      <div class="pill-controls">
        <span class="glass-pill pill-badge">Official CBA Bot</span>
        <button type="button" id="soundPill" class="glass-pill pill-sound active" aria-pressed="true">Liquid Sound: On</button>
      </div>
    </header>

    <section id="streamWell" class="stream-well" aria-live="polite">
      <div class="droplet bot">
        I am a bot to answer questions and answers according to the CBA of history from russian to pakistan migration.
        <span class="caption-meta">Created by: Mohammad Hassan</span>
      </div>
    </section>

    <form id="dockForm" class="liquid-dock">
      <input
        type="text"
        id="questionInput"
        placeholder="Ask anything about the CBA history presentation and press Enter..."
        autocomplete="off"
        required
      />
    </form>
  </main>

  <script>
    const CREATOR_NAME = "Mohammad Hassan";
    const BOT_IDENTITY = "I am a bot to answer questions and answers according to the CBA of history from russian to pakistan migration.";

    const FULL_CBA_KNOWLEDGE = `
Presentation Title: From Russia to Pakistan? Checking old maps and history records for the Ghuman family. Created by: Mohammad Hassan.

Full Slide-by-Slide Facts & Sources:
1. Main Question: Family stories say early people moved south from Russia to Pakistan. History books and maps check that claim with real records. (Family Oral Records; Britannica Eurasia Geography)
2. 4,500 Kilometers Across Asia: Russia to Punjab is more than 4,500 kilometers across cold land and high mountains. Long ago travelers walked or rode pack animals on those trips. (Encyclopaedia Britannica World Atlas)
3. Moving One Step at a Time: Big moves across Asia took many years and many families. People stayed near good water and crops for years before moving on. (UNESCO Silk Roads Programme)
4. Spoken Stories and Written Books: The Russia story has no dates or written papers. Old Punjab books list the Ghuman clan in Delhi, Jammu, and Sialkot. (Sialkot District Gazetteer, 1894)
5. Cold Weather and Moving South: One idea says cold weather pushed people south from Russia toward South Asia. Cold weather moved groups in history, but no record ties that trip to the Ghuman family. (Encyclopaedia Britannica Climate History)
6. What Historians Need for Proof: History proof needs real dates, place names, and written records with the family name. Right now no written record shows the Ghuman family leaving Russia. (The National Archives Historical Research Guide)
7. Three Checks for Any Move: Historians check three things: when people moved, which towns they passed, and written books listing the name. (FamilySearch Genealogical Proof Standard)
8. Why Families Moved in History: People moved in history for good farm land, trade, wars, or bad droughts with little water. (Encyclopaedia Britannica Human Migration)
9. Central Asia in the Middle: Central Asia sits between northern Asia and South Asia. For over 2,000 years travelers passed through towns like Samarkand and Bukhara. (UNESCO Silk Roads Programme)
10. Old Trade Roads Across Asia: Silk Roads linked Central Asia, Afghanistan, and northern India. Travelers carried goods like silk, spices, and horses along these paths for hundreds of years. (UNESCO Silk Roads Programme)
11. Mountain Paths Into Punjab: High mountains sit between Central Asia and Punjab. Travelers crossed through mountain gaps like the Khyber Pass to reach the plains. (Encyclopaedia Britannica Khyber Pass)
12. Four Parts of Long Trips: Long land trips had four parts: wide open plains, Central Asia towns, mountain passes, and river land in Punjab. (UNESCO Silk Roads Programme)
13. Road Maps Are Not Family Proof: Old trade roads show people could travel across Asia, but they do not prove one family walked from Russia. Records must name the family. (The National Archives Historical Research Guide)
14. Written Books in South Asia: Written books in South Asia name the Ghuman group in northern India and Punjab. Old district books list real villages and family branches. (A Glossary of the Tribes and Castes of the Punjab, 1911)
15. From Delhi and Jammu to Sialkot: Punjab books say early ancestors lived near Delhi before Raja Sanpal Janjua moved to Jammu. His descendant Raja Ghumman moved into Sialkot and started the Ghuman home. (Sialkot District Gazetteer, 1894)
16. Villages Near Five Rivers: Punjab gets its name from five rivers that water good wheat farms. From Sialkot, 21 Ghuman branches built farms in Gujranwala, Gurdaspur, Amritsar, and Lyallpur. (A Glossary of the Tribes and Castes of the Punjab, 1911)
17. 1911 Census Numbers: The 1911 Census counted 7,579 Ghuman people in Sialkot District alone. More than twelve villages in Gurdaspur and Sangrur also had the Ghuman name. (Census of India 1911, Punjab Volume XIV)
18. Different Spellings in Books: Writers spelled the name as Ghuman, Ghumman, or Ghamman across languages. Similar place names in other places do not prove shared family roots without records. (FamilySearch Name Spelling Guide)
19. The 1947 Split of Punjab: In August 1947 a new border split Punjab between Pakistan and India. Many families had to leave their homes quickly when the border line was drawn. (The National Archives UK Partition Records)
20. 14 Million People on the Move: About 14 million people crossed the new borders in 1947. People rode trains, carts, and walked in large groups recorded in government files and photos. (Encyclopaedia Britannica Partition of India)
21. How 1947 Split Ghuman Towns: Before 1947, Muslim and Sikh Ghuman families lived near each other in Punjab. The border put Sialkot in Pakistan and Gurdaspur in India, moving families across. (Punjab Partition Resettlement Records)
22. Talking to Elders and Saving Papers: Older family members remember village names, land papers, and old photos not in school books. Writing down who spoke and when helps check stories. (Oral History Society Guidelines)
23. Four Main Record Sets Used: 1911 Punjab Census, Sialkot and Gurdaspur district books, UK 1947 files, and FamilySearch records. (National Archives and Census of India)
24. Checking Every Map and Source: Each source was checked for author, year, and written proof. Arrows only belong where records show real travel, and unknown dates stay unknown. (National Geographic Historical Cartography Standards)
25. Proven Facts vs. Unproven Ideas: The 1947 move is proven, the Delhi and Jammu to Sialkot path is in Punjab books, and a trip from Russia is not proven. (Sialkot Gazetteer and UK National Archives)
26. Moving to Other Countries After 1950: Starting in the 1950s, Ghuman families moved from Punjab to Britain, Ireland, Canada, the US, and Gulf countries, shown in travel records. (UK National Archives Passenger Lists)
27. Checking Family Trees Online: FamilySearch and Ancestry hold old birth and land pages; historians check real scanned pages rather than unverified user guesses. (FamilySearch Research Wiki)
28. Key Dates in the Record: Punjab books trace movement to Sialkot, 1911 counts 7,579 Ghuman people in Sialkot District, and 1947 brings the Partition border move. (Census of India 1911 and Sialkot Gazetteer)
29. Gujranwala and Gurdaspur Farms: Ghuman families farmed across Gujranwala and Gurdaspur before 1947; district books record villages, crops, and local family ties in central Punjab. (Punjab District Gazetteers)
30. Reading Old Maps Carefully: Checking the map year prevents mixing old roads with modern country lines. (National Geographic Historical Cartography Standards)
31. What History Records Show: Census books, local gazetteers, and 1947 files show Punjab and the border clearly. (History CBA Research Synthesis)
32. Sources: Census of India 1911 (Punjab Volume XIV); Punjab District Gazetteers (Sialkot and Gurdaspur); The National Archives (UK); UNESCO Silk Roads Programme; Encyclopaedia Britannica; FamilySearch and Ancestry Archives.
`.trim();

    const SYSTEM_RULES = `
You are the official Q&A bot for a school history CBA presentation.
${FULL_CBA_KNOWLEDGE}

Strict Rules:
1. Never say you are Gemini, Google AI, or an AI model. If asked who or what you are, respond with: "${BOT_IDENTITY}"
2. If asked who created the presentation, who made it, or anything about the creator/author, answer that ${CREATOR_NAME} created the presentation.
3. Users may ask using casual slang, abbreviations, typos, or spelling mistakes (e.g., "who made dis", "when did ppl move", "wat abt 1947", "cap or legit", "wats da proof", "u gemini?"). Understand their intent clearly and respond in clear English using the CBA facts and historical context.
4. Answer questions thoroughly and clearly using the CBA facts above plus historical knowledge about Eurasia/Russia, Central Asia, Silk Roads, Khyber Pass, Punjab, the 1894 Gazetteer, the 1911 Census, the August 1947 Partition, post-1950 migration, and historical/archival methods.
5. If a question is clearly unrelated to these topics (such as video games, sports, cooking, movies, anime, weather, or unrelated homework), reply strictly with: Question not related
6. Remember earlier messages from both the user and assistant in this conversation.
`.trim();

    // Slang, shorthand, and typo/spelling mistake normalization
    const SLANG_REPLACEMENTS = [

    function resizeLiquidCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      cw = window.innerWidth;
      ch = window.innerHeight;
      liquidCanvas.width = Math.floor(cw * dpr);
      liquidCanvas.height = Math.floor(ch * dpr);
      lctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      if (fluidBlobs.length === 0) {
        const count = cw < 640 ? 5 : 8;
        for (let i = 0; i < count; i++) {
          fluidBlobs.push({
            baseX: (cw / (count + 1)) * (i + 1),
            baseY: (ch * 0.25) + ((i % 3) * ch * 0.24),
            x: (cw / (count + 1)) * (i + 1),
            y: (ch * 0.25) + ((i % 3) * ch * 0.24),
            vx: 0,
            vy: 0,
            radius: cw < 640 ? 95 + (i % 3) * 32 : 140 + (i % 3) * 48,
            phase: i * 1.15,
            speed: 0.008 + (i % 4) * 0.0025
          });
        }
      }
    }

    function spawnFluidRipple(x, y, strength = 1) {
      fluidRipples.push({
        x,
        y,
        r: 10,
        maxR: (cw < 640 ? 150 : 230) * strength,
        alpha: 0.55 * Math.min(1.2, strength),
        lineW: 2.4 * strength
      });

      for (const b of fluidBlobs) {
        const dx = b.x - x;
        const dy = b.y - y;
        const dist = Math.hypot(dx, dy) || 1;
        if (dist < 320) {
          const push = ((320 - dist) / 320) * 4.5 * strength;
          b.vx += (dx / dist) * push;
          b.vy += (dy / dist) * push;
        }
      }
    }

    function renderLiquidLoop() {
      lctx.clearRect(0, 0, cw, ch);

      const bgGrad = lctx.createRadialGradient(
        cw * 0.5,
        ch * 0.45,
        40,
        cw * 0.5,
        ch * 0.5,
        Math.max(cw, ch) * 0.78
      );
      bgGrad.addColorStop(0, "rgba(58, 16, 108, 0.26)");
      bgGrad.addColorStop(0.55, "rgba(24, 8, 52, 0.18)");
      bgGrad.addColorStop(1, "rgba(7, 3, 17, 0.42)");
      lctx.fillStyle = bgGrad;
      lctx.fillRect(0, 0, cw, ch);

      for (const b of fluidBlobs) {
        b.phase += b.speed;
        const targetX = b.baseX + Math.cos(b.phase) * 46;
        const targetY = b.baseY + Math.sin(b.phase * 1.25) * 36;

        if (pointer.active) {
          const dx = pointer.x - b.x;
          const dy = pointer.y - b.y;
          const dist = Math.hypot(dx, dy) || 1;
          if (dist < 260) {
            const pull = ((260 - dist) / 260) * 0.28;
            b.vx += (dx / dist) * pull;
            b.vy += (dy / dist) * pull;
          }
        }

        b.vx += (targetX - b.x) * 0.012;
        b.vy += (targetY - b.y) * 0.012;
        b.vx *= 0.92;
        b.vy *= 0.92;
        b.x += b.vx;
        b.y += b.vy;

        const blobGrad = lctx.createRadialGradient(b.x, b.y, b.radius * 0.08, b.x, b.y, b.radius);
        blobGrad.addColorStop(0, "rgba(168, 85, 247, 0.34)");
        blobGrad.addColorStop(0.55, "rgba(107, 33, 168, 0.18)");
        blobGrad.addColorStop(1, "rgba(30, 8, 64, 0)");

        lctx.save();
        lctx.beginPath();
        const points = 18;
        for (let i = 0; i <= points; i++) {
          const angle = (i / points) * Math.PI * 2;
          const wobble =
            1 +
            0.14 * Math.sin(angle * 3 + b.phase * 2.1) +
            0.09 * Math.cos(angle * 2 - b.phase * 1.7);
          const px = b.x + Math.cos(angle) * b.radius * wobble;
          const py = b.y + Math.sin(angle) * b.radius * wobble;
          if (i === 0) lctx.moveTo(px, py);
          else lctx.lineTo(px, py);
        }
        lctx.closePath();
        lctx.fillStyle = blobGrad;
        lctx.fill();
        lctx.restore();
      }

      for (let i = fluidRipples.length - 1; i >= 0; i--) {
        const rp = fluidRipples[i];
        rp.r += 3.8;
        rp.alpha *= 0.962;

        if (rp.alpha < 0.015 || rp.r > rp.maxR) {
          fluidRipples.splice(i, 1);
          continue;
        }

        lctx.save();
        lctx.beginPath();
        lctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
        lctx.strokeStyle = `rgba(216, 180, 254, ${rp.alpha.toFixed(3)})`;
        lctx.lineWidth = rp.lineW;
        lctx.stroke();
        lctx.restore();
      }

      requestAnimationFrame(renderLiquidLoop);
    }

    function getAudioContext() {
      if (!soundEnabled) return null;

    function playLiquidTone(startFreq, endFreq, duration, type = "sine", peakGain = 0.04, delay = 0) {
      const ctx = getAudioContext();
      if (!ctx) return;

      const now = ctx.currentTime + delay;
      const osc = ctx.createOscillator();
      const filter = ctx.createBiquadFilter();
      const gain = ctx.createGain();

      osc.type = type;
      osc.frequency.setValueAtTime(startFreq, now);
      if (typeof endFreq === "number") {
        osc.frequency.exponentialRampToValueAtTime(Math.max(45, endFreq), now + duration);
      }

      filter.type = "lowpass";
      filter.frequency.setValueAtTime(Math.min(4800, Math.max(400, startFreq * 2.6)), now);
      filter.Q.setValueAtTime(2.4, now);

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(peakGain, now + Math.min(0.025, duration * 0.25));
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);

      osc.start(now);
      osc.stop(now + duration + 0.03);
    }

    function typeLiquidReply(text, metaText = "From Russia to Pakistan?") {
      return new Promise((resolve) => {
        const box = document.createElement("div");
        box.className = "droplet bot flowing";

        const textSpan = document.createElement("span");
        const caretSpan = document.createElement("span");
        caretSpan.className = "liquid-cursor";

        box.appendChild(textSpan);
        box.appendChild(caretSpan);
        box.appendChild(metaSpan);
        streamWell.appendChild(box);

        let idx = 0;
        const baseSpeed = text.length > 260 ? 10 : 14;

        function step() {
          if (idx < text.length) {
            textSpan.textContent += text.charAt(idx);
            if (idx % 2 === 0) {
              playLiquidTick(idx);
            }
            idx += 1;
            streamWell.scrollTop = streamWell.scrollHeight;
            setTimeout(step, baseSpeed);
          } else {
            caretSpan.remove();
            box.classList.remove("flowing");
            metaSpan.style.opacity = "1";
            playLiquidArrival();
            streamWell.scrollTop = streamWell.scrollHeight;
            resolve();
          }
        }

        step();
      });
    }

    function normalizeModelReply(raw, q) {
      if (asksCreator(q)) return `${CREATOR_NAME} created this presentation.`;
      if (asksIdentity(q)) return BOT_IDENTITY;
      const clean = (raw || "").trim();
      if (!clean) return "Question not related";
      if (/^question not related[.!]?$/i.test(clean)) return "Question not related";
      return clean
        .replace(/\b(i am|i'm|as) (an? )?(gemini|google ai|large language model|language model)\b/gi, BOT_IDENTITY)
        .trim();
    }

    function fallbackFromDeck(q) {
      if (asksCreator(q)) return `${CREATOR_NAME} created this presentation.`;
      if (asksIdentity(q)) return BOT_IDENTITY;
      if (isGreeting(q)) {
        return `${BOT_IDENTITY} Ask me about dates, Eurasia routes, Punjab records, the 1911 census, the 1947 Partition, or sources.`;
      }
      if (isClearlyUnrelated(q)) return "Question not related";

      const norm = normalizeSlangAndTypos(q);
      let best = null;
      let bestScore = 0;

      for (const m of DETAILED_TOPICS) {
        let score = 0;
        for (const term of m.terms) {
          if (norm.includes(term)) score += 1;
        }
        if (score > bestScore) {
          bestScore = score;
          best = m;
        }
      }
      if (best && bestScore > 0) return best.reply;

      const priorUserText = memory
        .filter((item) => item.role === "user")
        .slice(-4)
        .map((item) => normalizeSlangAndTypos(item.content))
        .join(" ");

      for (const m of DETAILED_TOPICS) {
        if (m.terms.some((term) => priorUserText.includes(term))) {
          return m.reply;
        }
      }

      return "Question not related";
    }

    async function fetchWithTimeout(url, options, timeoutMs = 5500) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const res = await fetch(url, { ...options, signal: controller.signal });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res;
      } finally {
        clearTimeout(timer);
      }
    }

    async function fetchFreeModel(messages) {
      const endpoints = [
        {
          url: "https://text.pollinations.ai/openai/chat/completions",
          body: { model: "openai", messages, temperature: 0.25 }
        },
        {
          url: "https://text.pollinations.ai/",
          isPlainPrompt: true
        }
      ];

      for (const ep of endpoints) {
        try {
          if (ep.isPlainPrompt) {
            const res = await fetchWithTimeout(
              ep.url,
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  messages,
                  model: "openai",
                  temperature: 0.25
                })
              },
              5500
            );
            const contentType = res.headers.get("content-type") || "";
            if (contentType.includes("application/json")) {
              const json = await res.json();
              const text = json?.choices?.[0]?.message?.content || json?.content || "";
              if (text.trim()) return text;
            } else {
              const text = await res.text();
              if (text.trim()) return text;
            }
          } else {
            const res = await fetchWithTimeout(
              ep.url,
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(ep.body)
              },
              5500
            );
            const json = await res.json();
            const text = json?.choices?.[0]?.message?.content || "";
            if (text.trim()) return text;
          }
        } catch (_) {
          // Try next endpoint
        }
      }

      throw new Error("All free model endpoints timed out or failed");
    }

    async function answerQuestion(q) {
      if (asksCreator(q)) {
        return { text: `${CREATOR_NAME} created this presentation.`, note: "From Russia to Pakistan?" };
      }
      if (asksIdentity(q)) {
        return { text: BOT_IDENTITY, note: "From Russia to Pakistan?" };
      }
      if (isClearlyUnrelated(q)) {
        return { text: "Question not related", note: "From Russia to Pakistan?" };
      }

      const messages = [
        { role: "system", content: SYSTEM_RULES },
        ...memory.slice(-16),
        { role: "user", content: q }
      ];

      try {
        const raw = await fetchFreeModel(messages);
        return {
          text: normalizeModelReply(raw, q),
          note: "From Russia to Pakistan?"
        };
      } catch (_) {
        return {
          text: fallbackFromDeck(q),
          note: "From Russia to Pakistan?"
        };
      }
    }

    dockForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const q = questionInput.value.trim();
      if (!q) return;

      questionInput.value = "";
      questionInput.disabled = true;

      dockForm.classList.add("splash");
      setTimeout(() => dockForm.classList.remove("splash"), 260);

      const rect = dockForm.getBoundingClientRect();
      spawnFluidRipple(rect.left + rect.width * 0.5, rect.top + rect.height * 0.5, 1.35);

      playLiquidLaunch();
      addUserDroplet(q);

      const thinkingDroplet = createLiquidThinkingDroplet();
      const result = await answerQuestion(q);
      thinkingDroplet.remove();

      await typeLiquidReply(result.text, result.note);

      memory.push({ role: "user", content: q });
      memory.push({ role: "assistant", content: result.text });

      questionInput.disabled = false;
      questionInput.focus();
    });
  </script>
</body>
</html>
